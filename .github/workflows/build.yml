name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup NDK r28c
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DANDROID_STL=c++_shared \
            -DCMAKE_CXX_FLAGS="-include cstdlib"
          cmake --build build
          mkdir -p pack
          cp manifest.json pack/
          cp build/libno_updates.so pack/
          cd pack && zip -r ../NoUpdates.levipack .
      - uses: actions/upload-artifact@v4
        with:
          name: NoUpdates.levipack
          path: NoUpdates.levipack
